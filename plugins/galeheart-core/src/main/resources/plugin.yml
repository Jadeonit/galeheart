name: GaleHeartCore
version: '${project.version}'
main: ru.galeheart.core.GaleHeartCore
api-version: '1.21'
authors: [ GaleHeart ]
description: Hearts, cooldowns, heart cooling, seasons and quests.

commands:
  hearts:
    description: Show your hearts
    usage: /hearts
    aliases: [ heart, hp ]
  top:
    description: Hearts leaderboard
    usage: /top
    aliases: [ leaderboard, lb ]
  season:
    description: Season info and admin controls
    usage: /season
    aliases: [ s ]
  pass:
    description: Season pass menu
    usage: /pass
    aliases: [ bp, battlepass ]
  locker:
    description: Cosmetics - titles, trails, join effects
    usage: /locker
    aliases: [ cosmetics, wardrobe ]
  achievements:
    description: Achievement board
    usage: /achievements
    aliases: [ ach, advancements ]
  cosmetic:
    description: Grant a cosmetic directly
    usage: /cosmetic give <player> <id>
    permission: galeheart.admin
  news:
    description: Latest announcements from Discord
    usage: /news [page]
    aliases: [ announcements ]
  grant:
    description: Grant a donation rank
    usage: /grant <player> <rank>
    permission: galeheart.admin
  bounty:
    description: Show your bounty contract
    usage: /bounty
  quest:
    description: Quest progress
    usage: /quest

permissions:
  galeheart.admin:
    description: Full admin access
    default: op
  galeheart.bypass.protection:
    description: Ignores new-player protection
    default: op
