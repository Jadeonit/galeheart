# ═════════════════════════════════════════════════════════════════════════
#  AnomalousWeather — weather anomalies (Paper 1.21+)
#
#  Vanilla weather is NOT removed or disabled. An anomaly runs on top of it
#  and stands out with:
#    • a BossBar with the anomaly name and a timer
#    • particles around players and unique sounds
#    • a full-screen title on start and actionbar hints
#    • a personal (client-side) rain overlay per player
#  Server weather changes ONLY when override-vanilla-weather is true,
#  and is restored to its previous state when the anomaly ends.
#
#  Colors and text use MiniMessage: <green>, <bold>, <gradient:#...>
#  Legacy & codes are also supported.
# ═════════════════════════════════════════════════════════════════════════

settings:
  # Worlds where anomalies run. "*" — every world.
  worlds:
    - "*"

  # true — an anomaly can only start while vanilla rain/thunder is active.
  # Vanilla weather itself is not changed.
  require-vanilla-rain: false

  # true — the server weather becomes rainy for the duration of the anomaly
  # (and is restored afterwards). false — the plugin never touches server
  # weather (recommended).
  override-vanilla-weather: false

  # true — the player sees personal rain (client-side only) so the anomaly
  # is visible even in clear weather. Other players and server weather are
  # not affected.
  visual-fake-weather: true

  # How often to roll for an anomaly (seconds).
  check-interval-seconds: 14400

  # Chance (%) that a roll starts an anomaly.
  anomaly-chance-percent: 45

  # Minimum players online for a random anomaly to start.
  # Keeps events from firing into an empty server at night.
  # 1 — one player is enough, 0 — no check.
  min-players: 1

  # Hard cap on random anomalies per day. 0 - no cap.
  max-per-day: 2

  # Cooldown after an anomaly ends before the next roll (seconds).
  cooldown:
    min-seconds: 180
    max-seconds: 480

  # Default anomaly duration (seconds).
  # Can be overridden per anomaly (duration.min/max-seconds).
  duration:
    min-seconds: 120
    max-seconds: 240

  # Radius (blocks) for particles and mob damage.
  effect-radius: 12

  # Do not affect creative/spectator players.
  ignore-creative: true
  ignore-spectator: true

  # If set (e.g. anomalousweather.immune), players with this node
  # are unaffected by anomalies. Empty — disabled.
  immunity-permission: ""

  announce:
    start-message: true
    end-message: true
    title: true
    bossbar: true
    actionbar-warning: true

  # How often (seconds) to remind about the required protection.
  warning-interval-seconds: 10

  # Countdown before an anomaly starts: BossBar timer and chat warnings.
  warning:
    enabled: true
    # How many seconds before the start the countdown begins (3600 = one hour).
    lead-seconds: 3600
    # Moments (seconds before start) to announce in chat and play a sound.
    # Values above lead-seconds are ignored.
    announce-at-seconds: [ 3600, 1800, 600, 300, 60 ]
    # Show the countdown in a separate BossBar.
    bossbar: true
    sound:
      enabled: true
      key: "minecraft:block.note_block.bell"
      volume: 0.8
      pitch: 1.1

# ═════════════════════════════════════════════════════════════════════════
#  ANOMALIES
#
#  chance — weight: higher means more often.
#  Effective chance = weight / sum of weights of enabled anomalies.
#  See current chances with /anomaly list.
#
#  Common keys:
#    enabled              — is the anomaly active
#    chance               — weight
#    display-name         — name in the BossBar and messages
#    title / subtitle     — big text on start
#    bossbar-color        — PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
#    fake-weather         — DOWNFALL (rain), CLEAR, NONE
#    vanilla-thunder      — enable thunder (only with override-vanilla-weather)
#    duration.min/max-seconds — duration, overrides the global one
#    require-sky          — only applies under open sky
#    water-protects       — water blocks the effect (acid rain)
#    affect-mobs          — damage nearby mobs
#    damage.amount        — damage per tick in health points (2.0 = 1 heart)
#    damage.interval-seconds — how often damage is applied
#    armor-durability-damage — durability removed from armor
#    effects              — list of "TYPE:AMPLIFIER:TICKS"
#    particles            — type, color (DUST), size, count, radius
#    sound                — key, volume, pitch, interval-seconds
#
#  Special keys:
#    fire-ticks           — burn ticks without protection (20 ticks = 1 s)
#    freeze-ticks         — freeze ticks without protection (200 = max)
#    lightning.*          — lightning (THUNDERSTORM)
#    teleport.*           — teleportation (VOID_STORM)
# ═════════════════════════════════════════════════════════════════════════
weathers:

  # ── 1. ACID RAIN ──────────────────────────────────────────────────────
  #    Eats players and armor. Protection: acid-proof helmet.
  #    Water blocks the effect (water-protects).
  ACID_RAIN:
    enabled: true
    chance: 25
    display-name: "<dark_green>☣ Acid Rain"
    title: "<dark_green><bold>☣ ACID RAIN</bold>"
    subtitle: "<gray>Wear the <green>acid-proof helmet<gray>!"
    bossbar-color: GREEN
    fake-weather: DOWNFALL
    vanilla-thunder: false
    duration:
      min-seconds: 90
      max-seconds: 180
    require-sky: true
    water-protects: true
    affect-mobs: true
    damage:
      amount: 2.0
      interval-seconds: 4
    armor-durability-damage: 3
    effects:
      - "POISON:0:60"
      - "SLOWNESS:0:60"
    particles:
      type: DUST
      color: "#6BFF3C"
      size: 1.2
      count: 12
      radius: 8
    sound:
      key: "minecraft:weather.rain"
      volume: 0.7
      pitch: 0.55
      interval-seconds: 6

  # ── 2. FIRE RAIN ──────────────────────────────────────────────────────
  #    Burns everything under open sky. Protection: fireproof cloak.
  FIRE_RAIN:
    enabled: true
    chance: 18
    display-name: "<red>☄ Fire Rain"
    title: "<red><bold>☄ FIRE RAIN</bold>"
    subtitle: "<gray>Wear the <gold>fireproof cloak<gray>!"
    bossbar-color: RED
    fake-weather: CLEAR
    vanilla-thunder: false
    duration:
      min-seconds: 90
      max-seconds: 150
    require-sky: true
    water-protects: true
    affect-mobs: true
    damage:
      amount: 1.5
      interval-seconds: 5
    armor-durability-damage: 0
    fire-ticks: 80
    effects: []
    particles:
      type: FLAME
      count: 10
      radius: 7
    sound:
      key: "minecraft:block.fire.ambient"
      volume: 0.7
      pitch: 0.7
      interval-seconds: 5

  # ── 3. BLIZZARD ───────────────────────────────────────────────────────
  #    Freezes and slows. Protection: insulated boots.
  BLIZZARD:
    enabled: true
    chance: 15
    display-name: "<aqua>❄ Blizzard"
    title: "<aqua><bold>❄ BLIZZARD</bold>"
    subtitle: "<gray>Wear the <white>insulated boots<gray>!"
    bossbar-color: BLUE
    fake-weather: DOWNFALL
    vanilla-thunder: false
    duration:
      min-seconds: 120
      max-seconds: 240
    require-sky: true
    water-protects: false
    affect-mobs: true
    damage:
      amount: 1.0
      interval-seconds: 5
    armor-durability-damage: 0
    freeze-ticks: 60
    effects:
      - "SLOWNESS:1:80"
    particles:
      type: SNOWFLAKE
      count: 14
      radius: 9
    sound:
      key: "minecraft:entity.player.hurt_freeze"
      volume: 0.5
      pitch: 1.4
      interval-seconds: 7

  # ── 4. SANDSTORM ──────────────────────────────────────────────────────
  #    Blinds, drains hunger, slows. Protection: dust guard.
  SANDSTORM:
    enabled: true
    chance: 14
    display-name: "<gold>≋ Sandstorm"
    title: "<gold><bold>≋ SANDSTORM</bold>"
    subtitle: "<gray>Wear the <yellow>dust guard<gray>!"
    bossbar-color: YELLOW
    fake-weather: CLEAR
    vanilla-thunder: false
    duration:
      min-seconds: 100
      max-seconds: 200
    require-sky: true
    water-protects: false
    affect-mobs: true
    damage:
      amount: 1.0
      interval-seconds: 6
    armor-durability-damage: 0
    effects:
      - "BLINDNESS:0:80"
      - "HUNGER:0:80"
      - "SLOWNESS:0:80"
    particles:
      type: CAMPFIRE_COSY_SMOKE
      count: 16
      radius: 9
    sound:
      key: "minecraft:block.sand.break"
      volume: 0.6
      pitch: 0.7
      interval-seconds: 4

  # ── 5. TOXIC FOG ──────────────────────────────────────────────────────
  #    Poisons even indoors (require-sky: false).
  #    Protection: lead mask.
  TOXIC_FOG:
    enabled: true
    chance: 12
    display-name: "<dark_purple>☠ Toxic Fog"
    title: "<dark_purple><bold>☠ TOXIC FOG</bold>"
    subtitle: "<gray>Wear the <dark_gray>lead mask<gray>!"
    bossbar-color: PURPLE
    fake-weather: DOWNFALL
    vanilla-thunder: false
    duration:
      min-seconds: 120
      max-seconds: 240
    require-sky: false
    water-protects: false
    affect-mobs: true
    damage:
      amount: 1.0
      interval-seconds: 4
    armor-durability-damage: 1
    effects:
      - "POISON:0:80"
      - "NAUSEA:0:120"
    particles:
      type: DUST
      color: "#7B2FBE"
      size: 1.6
      count: 14
      radius: 9
    sound:
      key: "minecraft:entity.husk.ambient"
      volume: 0.5
      pitch: 0.6
      interval-seconds: 6

  # ── 6. THUNDERSTORM ───────────────────────────────────────────────────
  #    Frequent lightning at unprotected players.
  #    Protection: lightning charm (off hand).
  THUNDERSTORM:
    enabled: true
    chance: 10
    display-name: "<yellow>⚡ Thunderstorm"
    title: "<yellow><bold>⚡ THUNDERSTORM</bold>"
    subtitle: "<gray>Hold the <gold>lightning charm<gray> in your off hand!"
    bossbar-color: YELLOW
    fake-weather: DOWNFALL
    vanilla-thunder: true
    duration:
      min-seconds: 90
      max-seconds: 180
    require-sky: true
    water-protects: false
    affect-mobs: false
    damage:
      amount: 0.0
      interval-seconds: 5
    armor-durability-damage: 0
    effects: []
    particles:
      type: ELECTRIC_SPARK
      count: 10
      radius: 10
    sound:
      key: "minecraft:entity.lightning_bolt.thunder"
      volume: 0.35
      pitch: 1.0
      interval-seconds: 12
    lightning:
      enabled: true
      # true — real lightning (can start fires), false — visual only.
      real-lightning: true
      interval-seconds: 10
      # Chance (%) to strike an unprotected player on each interval.
      chance-percent: 45
      damage: 4.0
      fire-ticks: 40

  # ── 7. VOID STORM ─────────────────────────────────────────────────────
  #    Randomly teleports players. Protection: ender charm (off hand).
  VOID_STORM:
    enabled: true
    chance: 6
    display-name: "<dark_purple>✵ Void Storm"
    title: "<dark_purple><bold>✵ VOID STORM</bold>"
    subtitle: "<gray>Hold the <light_purple>ender charm<gray> in your off hand!"
    bossbar-color: PURPLE
    fake-weather: CLEAR
    vanilla-thunder: false
    duration:
      min-seconds: 90
      max-seconds: 150
    require-sky: false
    water-protects: false
    affect-mobs: false
    damage:
      amount: 1.0
      interval-seconds: 6
    armor-durability-damage: 0
    effects:
      - "NAUSEA:0:100"
    particles:
      type: PORTAL
      count: 16
      radius: 6
    sound:
      key: "minecraft:entity.enderman.ambient"
      volume: 0.4
      pitch: 0.7
      interval-seconds: 8
    teleport:
      enabled: true
      interval-seconds: 8
      chance-percent: 35
      # Radius (blocks) the player can be teleported within.
      radius: 20
      damage: 1.0
      sound: "minecraft:entity.enderman.teleport"

# ═════════════════════════════════════════════════════════════════════════
#  PROTECTION GEAR
#  Every item carries a hidden PDC key, so a renamed item does not count.
#  Crafting recipes are described in README.md.
# ═════════════════════════════════════════════════════════════════════════
protection:
  # Show an actionbar hint when the player has no protection.
  warn-without-protection: true

  recipes:
    # true — register crafting recipes for protection gear.
    enabled: true
    # true — unlock the recipes in every player's recipe book on join.
    unlock-on-join: true

  items:
    ACID_RAIN:
      material: LEATHER_HELMET
      # Slot: HEAD, CHEST, LEGS, FEET, OFF_HAND, MAIN_HAND or ANY.
      slot: HEAD
      name: "<green>Acid-Proof Helmet"
      lore:
        - "<gray>Full immunity to <dark_green>acid rain"
        - "<dark_gray>Anomalous Weather"
      glow: true
      unbreakable: true
      custom-model-data: 0
      # Damage absorbed: 1.0 — full protection, 0.5 — half.
      damage-reduction: 1.0
      # Block negative effects (poison, blindness, etc.).
      blocks-effects: true
      # true — cannot be dropped (Q), placed in an item frame,
      # inserted into an end portal frame, or lost on death.
      prevent-drop: false

    FIRE_RAIN:
      material: LEATHER_CHESTPLATE
      slot: CHEST
      name: "<gold>Fireproof Cloak"
      lore:
        - "<gray>Full immunity to <red>fire rain"
        - "<dark_gray>Anomalous Weather"
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false

    BLIZZARD:
      material: LEATHER_BOOTS
      slot: FEET
      name: "<aqua>Insulated Boots"
      lore:
        - "<gray>Full immunity to the <aqua>blizzard"
        - "<dark_gray>Anomalous Weather"
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false

    SANDSTORM:
      material: LEATHER_LEGGINGS
      slot: LEGS
      name: "<gold>Dust Guard"
      lore:
        - "<gray>Full immunity to the <gold>sandstorm"
        - "<dark_gray>Anomalous Weather"
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false

    TOXIC_FOG:
      material: IRON_HELMET
      slot: HEAD
      name: "<dark_purple>Lead Mask"
      lore:
        - "<gray>Full immunity to the <dark_purple>toxic fog"
        - "<dark_gray>Anomalous Weather"
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false

    THUNDERSTORM:
      material: LIGHTNING_ROD
      slot: OFF_HAND
      name: "<yellow>Lightning Charm"
      lore:
        - "<gray>Draws lightning away from its holder"
        - "<dark_gray>Hold it in your off hand"
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false

    VOID_STORM:
      material: ENDER_EYE
      slot: OFF_HAND
      name: "<light_purple>Ender Charm"
      lore:
        - "<gray>Void storm cannot teleport you"
        - "<dark_gray>Hold it in your off hand"
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      # true — cannot be dropped, framed, inserted into an end portal
      # frame, or lost on death.
      prevent-drop: true

# ═════════════════════════════════════════════════════════════════════════
#  MESSAGES
#  Placeholders: {prefix}, {weather}, {time}, {chance}, {protection},
#                {player}, {type}, {state}, {count}, {slot}
# ═════════════════════════════════════════════════════════════════════════
messages:
  prefix: "<gradient:#00C9FF:#92FE9D>[Weather]</gradient> "

  anomaly-start: "{prefix}<yellow>An anomaly is forming: {weather}<yellow>! Lasts <white>{time}<yellow>."
  anomaly-end: "{prefix}<yellow>The {weather} <yellow>has faded."
  anomaly-status: "{prefix}<gray>Now: {weather} <dark_gray>({time} left)"
  anomaly-warning: "{prefix}<yellow>⚠ {weather} <yellow>in <white>{time}<yellow>. Get your gear ready!"
  anomaly-forecast: "{prefix}<gray>Expected: {weather} <dark_gray>— in {time}"
  no-anomaly: "{prefix}<gray>No anomaly right now. Next roll in <white>{time}<gray>."
  actionbar-warning: "<red>⚠ {weather} <red>— protection needed: {protection}"
  item-cannot-drop: "<red>⚠ This item cannot be dropped!"
  item-kept-on-death: "<gray>Your protection item survived the death."

  started-by-command: "{prefix}<green>Started {weather} <green>for {time}."
  stopped-by-command: "{prefix}<green>Anomaly stopped."
  reloaded: "{prefix}<green>Config reloaded. Anomalies loaded: <white>{count}<green>."
  given: "{prefix}<green>Granted: {protection} <gray>→ <white>{player}<green>."
  received: "{prefix}<green>You received: {protection}<green>."
  player-not-found: "{prefix}<red>Player <white>{player} <red>not found."
  unknown-weather: "{prefix}<red>Unknown anomaly: <white>{type}"
  no-permission: "{prefix}<red>No permission."

  command-usage: "{prefix}<yellow>Commands: <white>/anomaly status<yellow>, <white>list<yellow>, <white>start <type> [sec]<yellow>, <white>stop<yellow>, <white>give <player> <type><yellow>, <white>protection<yellow>, <white>reload"
  list-header: "{prefix}<white>Anomalies (chance / state / protection):"
  list-entry: "<gray> • {weather} <dark_gray>— <white>{chance}% <gray>({state}<gray>) protection: <white>{protection}"
  protection-header: "{prefix}<white>Protection items:"
  protection-entry: "<gray> • {weather} <dark_gray>— <white>{protection} <gray>(slot: {slot})"

# Event notifications.
# Easiest: paste a Discord webhook URL below, no bot needed.
# If webhook is empty, events are POSTed to discord.endpoint (the Python bot).
discord:
  enabled: false
  webhook: ""
  # Display name and avatar for webhook messages.
  # avatar must be a public image URL; leave empty to use the webhook's own avatar.
  name: "GaleHeart Weather"
  avatar: ""
  endpoint: "http://127.0.0.1:8099/event"
  secret: ""
