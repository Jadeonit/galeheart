settings:
  worlds:
  - '*'
  require-vanilla-rain: false
  override-vanilla-weather: false
  visual-fake-weather: true
  check-interval-seconds: 14400
  anomaly-chance-percent: 45
  min-players: 1
  max-per-day: 2
  cooldown:
    min-seconds: 180
    max-seconds: 480
  duration:
    min-seconds: 120
    max-seconds: 240
  effect-radius: 12
  ignore-creative: true
  ignore-spectator: true
  immunity-permission: ''
  announce:
    start-message: true
    end-message: true
    title: true
    bossbar: true
    actionbar-warning: true
  warning-interval-seconds: 10
  warning:
    enabled: true
    lead-seconds: 3600
    announce-at-seconds:
    - 3600
    - 1800
    - 600
    - 300
    - 60
    bossbar: true
    sound:
      enabled: true
      key: minecraft:block.note_block.bell
      volume: 0.8
      pitch: 1.1
weathers:
  ACID_RAIN:
    enabled: true
    chance: 25
    display-name: <dark_green>☣ Acid Rain
    title: <dark_green><bold>☣ ACID RAIN</bold>
    subtitle: <gray>Wear the <green>acid-proof helmet<gray>!
    bossbar-color: GREEN
    fake-weather: DOWNFALL
    vanilla-thunder: false
    duration:
      min-seconds: 90
      max-seconds: 180
    require-sky: true
    water-protects: true
    affect-mobs: true
    damage:
      amount: 2.0
      interval-seconds: 4
    armor-durability-damage: 3
    effects:
    - POISON:0:60
    - SLOWNESS:0:60
    particles:
      type: DUST
      color: '#6BFF3C'
      size: 1.2
      count: 12
      radius: 8
    sound:
      key: minecraft:weather.rain
      volume: 0.7
      pitch: 0.55
      interval-seconds: 6
  FIRE_RAIN:
    enabled: true
    chance: 18
    display-name: <red>☄ Fire Rain
    title: <red><bold>☄ FIRE RAIN</bold>
    subtitle: <gray>Wear the <gold>fireproof cloak<gray>!
    bossbar-color: RED
    fake-weather: CLEAR
    vanilla-thunder: false
    duration:
      min-seconds: 90
      max-seconds: 150
    require-sky: true
    water-protects: true
    affect-mobs: true
    damage:
      amount: 1.5
      interval-seconds: 5
    armor-durability-damage: 0
    fire-ticks: 80
    effects: []
    particles:
      type: FLAME
      count: 10
      radius: 7
    sound:
      key: minecraft:block.fire.ambient
      volume: 0.7
      pitch: 0.7
      interval-seconds: 5
  BLIZZARD:
    enabled: true
    chance: 15
    display-name: <aqua>❄ Blizzard
    title: <aqua><bold>❄ BLIZZARD</bold>
    subtitle: <gray>Wear the <white>insulated boots<gray>!
    bossbar-color: BLUE
    fake-weather: DOWNFALL
    vanilla-thunder: false
    duration:
      min-seconds: 120
      max-seconds: 240
    require-sky: true
    water-protects: false
    affect-mobs: true
    damage:
      amount: 1.0
      interval-seconds: 5
    armor-durability-damage: 0
    freeze-ticks: 60
    effects:
    - SLOWNESS:1:80
    particles:
      type: SNOWFLAKE
      count: 14
      radius: 9
    sound:
      key: minecraft:entity.player.hurt_freeze
      volume: 0.5
      pitch: 1.4
      interval-seconds: 7
  SANDSTORM:
    enabled: true
    chance: 14
    display-name: <gold>≋ Sandstorm
    title: <gold><bold>≋ SANDSTORM</bold>
    subtitle: <gray>Wear the <yellow>dust guard<gray>!
    bossbar-color: YELLOW
    fake-weather: CLEAR
    vanilla-thunder: false
    duration:
      min-seconds: 100
      max-seconds: 200
    require-sky: true
    water-protects: false
    affect-mobs: true
    damage:
      amount: 1.0
      interval-seconds: 6
    armor-durability-damage: 0
    effects:
    - BLINDNESS:0:80
    - HUNGER:0:80
    - SLOWNESS:0:80
    particles:
      type: CAMPFIRE_COSY_SMOKE
      count: 16
      radius: 9
    sound:
      key: minecraft:block.sand.break
      volume: 0.6
      pitch: 0.7
      interval-seconds: 4
  TOXIC_FOG:
    enabled: true
    chance: 12
    display-name: <dark_purple>☠ Toxic Fog
    title: <dark_purple><bold>☠ TOXIC FOG</bold>
    subtitle: <gray>Wear the <dark_gray>lead mask<gray>!
    bossbar-color: PURPLE
    fake-weather: DOWNFALL
    vanilla-thunder: false
    duration:
      min-seconds: 120
      max-seconds: 240
    require-sky: false
    water-protects: false
    affect-mobs: true
    damage:
      amount: 1.0
      interval-seconds: 4
    armor-durability-damage: 1
    effects:
    - POISON:0:80
    - NAUSEA:0:120
    particles:
      type: DUST
      color: '#7B2FBE'
      size: 1.6
      count: 14
      radius: 9
    sound:
      key: minecraft:entity.husk.ambient
      volume: 0.5
      pitch: 0.6
      interval-seconds: 6
  THUNDERSTORM:
    enabled: true
    chance: 10
    display-name: <yellow>⚡ Thunderstorm
    title: <yellow><bold>⚡ THUNDERSTORM</bold>
    subtitle: <gray>Hold the <gold>lightning charm<gray> in your off hand!
    bossbar-color: YELLOW
    fake-weather: DOWNFALL
    vanilla-thunder: true
    duration:
      min-seconds: 90
      max-seconds: 180
    require-sky: true
    water-protects: false
    affect-mobs: false
    damage:
      amount: 0.0
      interval-seconds: 5
    armor-durability-damage: 0
    effects: []
    particles:
      type: ELECTRIC_SPARK
      count: 10
      radius: 10
    sound:
      key: minecraft:entity.lightning_bolt.thunder
      volume: 0.35
      pitch: 1.0
      interval-seconds: 12
    lightning:
      enabled: true
      real-lightning: true
      interval-seconds: 10
      chance-percent: 45
      damage: 4.0
      fire-ticks: 40
  VOID_STORM:
    enabled: true
    chance: 6
    display-name: <dark_purple>✵ Void Storm
    title: <dark_purple><bold>✵ VOID STORM</bold>
    subtitle: <gray>Hold the <light_purple>ender charm<gray> in your off hand!
    bossbar-color: PURPLE
    fake-weather: CLEAR
    vanilla-thunder: false
    duration:
      min-seconds: 90
      max-seconds: 150
    require-sky: false
    water-protects: false
    affect-mobs: false
    damage:
      amount: 1.0
      interval-seconds: 6
    armor-durability-damage: 0
    effects:
    - NAUSEA:0:100
    particles:
      type: PORTAL
      count: 16
      radius: 6
    sound:
      key: minecraft:entity.enderman.ambient
      volume: 0.4
      pitch: 0.7
      interval-seconds: 8
    teleport:
      enabled: true
      interval-seconds: 8
      chance-percent: 35
      radius: 20
      damage: 1.0
      sound: minecraft:entity.enderman.teleport
protection:
  warn-without-protection: true
  recipes:
    enabled: true
    unlock-on-join: true
  items:
    ACID_RAIN:
      material: LEATHER_HELMET
      slot: HEAD
      name: <green>Acid-Proof Helmet
      lore:
      - <gray>Full immunity to <dark_green>acid rain
      - <dark_gray>Anomalous Weather
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false
    FIRE_RAIN:
      material: LEATHER_CHESTPLATE
      slot: CHEST
      name: <gold>Fireproof Cloak
      lore:
      - <gray>Full immunity to <red>fire rain
      - <dark_gray>Anomalous Weather
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false
    BLIZZARD:
      material: LEATHER_BOOTS
      slot: FEET
      name: <aqua>Insulated Boots
      lore:
      - <gray>Full immunity to the <aqua>blizzard
      - <dark_gray>Anomalous Weather
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false
    SANDSTORM:
      material: LEATHER_LEGGINGS
      slot: LEGS
      name: <gold>Dust Guard
      lore:
      - <gray>Full immunity to the <gold>sandstorm
      - <dark_gray>Anomalous Weather
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false
    TOXIC_FOG:
      material: IRON_HELMET
      slot: HEAD
      name: <dark_purple>Lead Mask
      lore:
      - <gray>Full immunity to the <dark_purple>toxic fog
      - <dark_gray>Anomalous Weather
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false
    THUNDERSTORM:
      material: LIGHTNING_ROD
      slot: OFF_HAND
      name: <yellow>Lightning Charm
      lore:
      - <gray>Draws lightning away from its holder
      - <dark_gray>Hold it in your off hand
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: false
    VOID_STORM:
      material: ENDER_EYE
      slot: OFF_HAND
      name: <light_purple>Ender Charm
      lore:
      - <gray>Void storm cannot teleport you
      - <dark_gray>Hold it in your off hand
      glow: true
      unbreakable: true
      custom-model-data: 0
      damage-reduction: 1.0
      blocks-effects: true
      prevent-drop: true
messages:
  prefix: '<gradient:#00C9FF:#92FE9D>[Weather]</gradient> '
  anomaly-start: '{prefix}<yellow>An anomaly is forming: {weather}<yellow>! Lasts
    <white>{time}<yellow>.'
  anomaly-end: '{prefix}<yellow>The {weather} <yellow>has faded.'
  anomaly-status: '{prefix}<gray>Now: {weather} <dark_gray>({time} left)'
  anomaly-warning: '{prefix}<yellow>⚠ {weather} <yellow>in <white>{time}<yellow>.
    Get your gear ready!'
  anomaly-forecast: '{prefix}<gray>Expected: {weather} <dark_gray>— in {time}'
  no-anomaly: '{prefix}<gray>No anomaly right now. Next roll in <white>{time}<gray>.'
  actionbar-warning: '<red>⚠ {weather} <red>— protection needed: {protection}'
  item-cannot-drop: <red>⚠ This item cannot be dropped!
  item-kept-on-death: <gray>Your protection item survived the death.
  started-by-command: '{prefix}<green>Started {weather} <green>for {time}.'
  stopped-by-command: '{prefix}<green>Anomaly stopped.'
  reloaded: '{prefix}<green>Config reloaded. Anomalies loaded: <white>{count}<green>.'
  given: '{prefix}<green>Granted: {protection} <gray>→ <white>{player}<green>.'
  received: '{prefix}<green>You received: {protection}<green>.'
  player-not-found: '{prefix}<red>Player <white>{player} <red>not found.'
  unknown-weather: '{prefix}<red>Unknown anomaly: <white>{type}'
  no-permission: '{prefix}<red>No permission.'
  command-usage: '{prefix}<yellow>Commands: <white>/anomaly status<yellow>, <white>list<yellow>,
    <white>start <type> [sec]<yellow>, <white>stop<yellow>, <white>give <player> <type><yellow>,
    <white>protection<yellow>, <white>reload'
  list-header: '{prefix}<white>Anomalies (chance / state / protection):'
  list-entry: '<gray> • {weather} <dark_gray>— <white>{chance}% <gray>({state}<gray>)
    protection: <white>{protection}'
  protection-header: '{prefix}<white>Protection items:'
  protection-entry: '<gray> • {weather} <dark_gray>— <white>{protection} <gray>(slot:
    {slot})'
discord:
  enabled: true
  webhook: ''
  name: GaleHeart Weather
  avatar: ''
  endpoint: http://127.0.0.1:8099/event
  secret: ''
  bot-token: ''
  channel-id: ''
  crosspost: true
