name: AnomalousWeather
version: '${project.version}'
main: ru.anomaly.weather.AnomalousWeatherPlugin
api-version: '1.21'
authors: [ AnomalousWeather ]
description: Weather anomalies — acid rain, fire rain, blizzard, sandstorm, toxic fog and more.
website: https://papermc.io

commands:
  anomaly:
    description: Manage the anomalous weather
    usage: /anomaly help
    aliases: [ aw ]

permissions:
  anomalousweather.admin:
    description: Full access to /anomaly (start, stop, give, reload)
    default: op
  anomalousweather.status:
    description: View anomaly status and list
    default: true
